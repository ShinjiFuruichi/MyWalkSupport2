<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPX Viewer</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <!-- CSS -->
  <link rel="stylesheet" href="static/style.css?v=20261124-6">
</head>

<body>
  <div id="fileSelector" class="hidden">
    <label for="gpxFileInput" class="fileBtn">コース選択</label>
    <input type="file" id="gpxFileInput" accept=".gpx">
  </div>

  <div id="setupPanel" style="display:none;">
    <div class="setupBox">
      <div>スタート予定時間</div>
      <input type="time" id="startPlannedInput"><br>

      <label>
        <input type="radio" name="mode" value="time" checked>
        目標時間
      </label>

      <label>
        <input type="radio" name="mode" value="pace">
        初速
      </label>

      <div>目標時間</div>
      <input type="number" id="targetHourInput"> 時間
      <input type="number" id="targetMinInput"> 分

      <div class="pace-input-group">
        <label>目標初速（分/km）</label><br>
        <input id="paceMinInput" type="number" placeholder="分" class="pace-input">
        <input id="paceSecInput" type="number" placeholder="秒" class="pace-input">
      </div>

      <div class="rest-default-row">
        <span>休憩時間</span>
        <input type="number" id="restInput" value="20">
        <span>分</span>
        <button id="applyAllBtn">全CPに適用</button>
      </div>

      <div class="cp-rest-title">CPごとの休憩時間（分）</div>
      <div id="cpRestContainer"></div>

      <div>標高間隔（m）</div>
      <input type="number" id="contourInput" value="100">

      <div>疲労による速度の減衰①</div>
      <input type="number" id="decayKm1" value="100"> km
      <input type="number" id="decayRate1" value="10"> %

      <div>疲労による速度の減衰②</div>
      <input type="number" id="decayKm2" value="200"> km
      <input type="number" id="decayRate2" value="30"> %

      <button id="startSetupBtn">設定</button>
    </div>
  </div>

  <div id="map"></div>

  <div id="status"></div>

  <!-- ボタン -->
  <button id="startBtn" class="hidden round-btn">▶</button>

  <div id="controlButtonsTop">
    <button id="configBtn" class="hidden round-btn">⚙️</button>
    <button id="cpListBtn" class="hidden round-btn">📊</button>
    <button id="updateBtn" class="hidden round-btn">↻</button>
    <button id="tagBtn" class="hidden round-btn">Tag</button>
    <button id="arrivalBtn" class="hidden round-btn"
            title="CP・エイド到着" aria-label="CP・エイド到着">到着</button>
  </div>
  <div id="controlButtonsRightUp">
    <button id="saveBtn" class="hidden round-btn">💾</button>
    <button id="endBtn" class="hidden round-btn">■</button>
  </div>
  <div id="controlButtonsRightDown">
    <button id="listBtn" class="hidden round-btn">📋</button>
    <button id="elevationBtn" class="hidden round-btn">⛰</button>
    <button id="quickBtn" class="hidden round-btn">📍</button>
  </div>

  <!-- 標高グラフ -->
  <div id="elevationContainer" class="hidden">
    <canvas id="elevationChart" width="300" height="120"></canvas>
  </div>

  <!-- 情報パネル -->
  <div id="infoPanel" class="panel hidden">

    <div id="courseName" class="panel-title"></div>

    <div class="panel-section">
      <div class="panel-title">⏱ 時間</div>
      <div id="timeInfo"></div>
    </div>

    <div class="panel-section">
      <div class="panel-title">📍 現在</div>
      <div id="progress"></div>
      <div id="remaining"></div>
    </div>

    <div class="panel-section">
      <div class="panel-title">🚩 次の目的地</div>
      <div id="next"></div>
    </div>

    <div class="panel-section">
      <div class="panel-title">⏱ ゴール時間</div>
      <div id="result"></div>
    </div>

  </div>

  <!-- タグメニュー -->
  <div id="tagPanel" class="tag-panel hidden">

    <div class="tag-header">
      <div class="tag-title">📍 タグ選択</div>
      <button id="closeTag" class="close-btn">✕</button>
    </div>

    <div id="tagContainer"></div>

  </div>
  <!-- 記録リスト -->
  <div id="overlayPanels">
    <div id="cpListPanel" class="over-panel hidden"></div>
    <div id="recordPanel" class="over-panel hidden"></div>
  </div>

  <!-- CP・エイド到着報告 -->
  <div id="arrivalPanel" class="hidden">
    <div class="arrival-box">
      <h2>CP・エイド到着</h2>

      <label for="arrivalSelect">CP・エイド、または現在地を選んでください</label>
      <select id="arrivalSelect"></select>

      <p id="arrivalLocationInfo"></p>

      <label for="arrivalReport">到着報告</label>
      <textarea id="arrivalReport" readonly></textarea>

      <p>
        <a id="arrivalMapLink" target="_blank" rel="noopener noreferrer">
          地図で見る ↗
        </a>
      </p>

      <button id="copyArrivalMapBtn" type="button">
        地図リンクをコピー
      </button>

      <p id="arrivalCopyStatus" aria-live="polite"></p>

      <div class="arrival-photo">
        <label for="arrivalPhotoInput">写真（任意）</label>
        <input id="arrivalPhotoInput" type="file" accept="image/*">

        <img id="arrivalPhotoPreview" class="hidden"
             alt="到着報告に添える写真">

        <button id="removeArrivalPhotoBtn" class="hidden"
                type="button">写真を取り消す</button>
      </div>
      <button id="createArrivalImageBtn" type="button">
        共有用画像を作る
      </button>

      <img id="arrivalSharePreview" class="hidden"
           alt="到着報告の共有用画像">

      <p id="arrivalImageStatus" aria-live="polite"></p>

      <button id="shareArrivalImageBtn" type="button">
        画像を保存
      </button>

      <p class="arrival-help">
        保存画面で「画像を保存」を選び、その後、下の投稿先を押してください。
      </p>

      <div class="arrival-app-buttons">
        <button id="openArrivalFacebookBtn" type="button"
                aria-label="地図リンクをコピーしてFacebookを開く">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path fill="currentColor"
                  d="M19 30V18h4l1-5h-5V9c0-1.5.5-2 2-2h3V2h-4c-5 0-7 3-7 7v4H9v5h4v12z"/>
          </svg>
          <span>Facebook</span>
        </button>

        <button id="openArrivalInstagramBtn" type="button"
                aria-label="地図リンクをコピーしてInstagramを開く">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <rect x="4" y="4" width="24" height="24" rx="7"
                  fill="none" stroke="currentColor" stroke-width="2.5"/>
            <circle cx="16" cy="16" r="6"
                    fill="none" stroke="currentColor" stroke-width="2.5"/>
            <circle cx="23" cy="9" r="1.7" fill="currentColor"/>
          </svg>
          <span>Instagram</span>
        </button>

        <button id="openArrivalLineBtn" type="button"
                aria-label="地図リンクをコピーしてLINEを開く">
          <svg viewBox="0 0 40 32" aria-hidden="true">
            <path d="M20 2C10 2 2 7 2 14c0 6 6 11 14 12l-1 5 9-6c8-1 14-5 14-11C38 7 30 2 20 2z"
                  fill="currentColor"/>
            <text x="20" y="18" text-anchor="middle"
                  fill="#087f35" font-family="sans-serif"
                  font-size="10" font-weight="bold">LINE</text>
          </svg>
          <span>LINE</span>
        </button>
      </div>

      <p id="arrivalAppStatus" aria-live="polite"></p>

      <p id="arrivalShareStatus" aria-live="polite"></p>

      <button id="closeArrivalBtn" type="button">閉じる</button>
    </div>
  </div>

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- JS -->
  <script src="script.js?v=20261124-6"></script>
</body>
</html>
